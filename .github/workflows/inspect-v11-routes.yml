name: Inspect V12 Routes

on:
  push:
    branches: [p1-v12-rebuild]
    paths:
      - 'scripts/inspect-routes.mjs'
      - '.github/workflows/inspect-v11-routes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Assemble and patch V12
        run: npm run check
      - name: Inspect routes and production keywords
        run: node scripts/inspect-routes.mjs
