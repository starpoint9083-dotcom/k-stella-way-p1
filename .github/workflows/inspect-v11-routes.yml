name: Inspect V11 Routes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect-routes.mjs'
      - '.github/workflows/inspect-v11-routes.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/inspect-routes.mjs'
      - '.github/workflows/inspect-v11-routes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Assemble and patch V11
        run: npm run check
      - name: Inspect session/auth route insertion points
        run: node scripts/inspect-routes.mjs
