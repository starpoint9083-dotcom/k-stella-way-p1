name: Validate P3 Bridge Auth

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch-free-mode.mjs'
      - 'scripts/preflight.mjs'
      - 'scripts/inspect-lineup-generate.mjs'
      - '.github/workflows/validate-p3-bridge.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Assemble, inject bridge auth, and syntax check
        run: npm run check
      - name: Inspect lineup generation internals
        run: node scripts/inspect-lineup-generate.mjs
      - name: P1 preflight
        run: npm run preflight
      - name: Assert bridge auth is present
        run: node -e "const s=require('fs').readFileSync('src/index.js','utf8'); if(!s.includes('env.P3_BRIDGE_TOKEN&&token===env.P3_BRIDGE_TOKEN')) process.exit(1); console.log('P3 bridge auth validation PASS');"
