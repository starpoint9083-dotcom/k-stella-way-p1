name: P1 Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: p1-k-stella-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Assemble + syntax check
        run: npm run check

      - name: Inspect asset API usage
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('src/index.js','utf8').split(/\r?\n/);
          for (let i=0;i<lines.length;i++) {
            if (lines[i].includes('ASSETS_BUCKET')) {
              const a=Math.max(0,i-2), b=Math.min(lines.length,i+3);
              console.log(`--- ASSETS_BUCKET around line ${i+1} ---`);
              console.log(lines.slice(a,b).map((x,j)=>`${a+j+1}: ${x}`).join('\n'));
            }
          }
          NODE

      - name: P1 preflight
        run: npm run preflight

      - name: Check Cloudflare token
        id: creds
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare token is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare token is not configured; validation passed and deploy is safely skipped."
          fi

      - name: Resolve dedicated K-STELLA-P1 account
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          resp=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=100")
          account_id=$(printf '%s' "$resp" | jq -r '[.result[]? | select(.name == "K-STELLA-P1")][0].id // empty')
          if [ -z "$account_id" ]; then
            echo "Dedicated Cloudflare account K-STELLA-P1 was not found by this token."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Resolved dedicated K-STELLA-P1 account."

      - name: Ensure dedicated D1 and R2 exist
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          d1_json=$(npx wrangler d1 list --json)
          if ! printf '%s' "$d1_json" | jq -e '.[]? | select(.name == "k-stella-shorts-factory")' >/dev/null; then
            echo "Creating dedicated D1 k-stella-shorts-factory"
            npx wrangler d1 create k-stella-shorts-factory
          else
            echo "Dedicated D1 already exists."
          fi

          r2_text=$(npx wrangler r2 bucket list)
          if ! printf '%s' "$r2_text" | grep -Fq 'k-stella-shorts-assets'; then
            echo "Creating dedicated R2 k-stella-shorts-assets"
            npx wrangler r2 bucket create k-stella-shorts-assets
          else
            echo "Dedicated R2 already exists."
          fi

      - name: Resolve dedicated D1 binding
        if: steps.creds.outputs.ready == 'true'
        run: npm run generate:wrangler

      - name: Wrangler dry-run
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler.generated.toml --dry-run --outdir .wrangler-dry-run

      - name: Deploy P1 Worker only
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.generated.toml 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | tail -1 || true)
          if [ -z "$URL" ]; then
            echo "Could not determine workers.dev URL from deploy output"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: End-to-end health verification
        if: steps.creds.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/verify-deploy.mjs
