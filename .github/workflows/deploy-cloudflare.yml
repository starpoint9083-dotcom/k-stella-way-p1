name: P1 Cloudflare Deploy

on:
  push:
    branches: [main, p1-v12-rebuild]
  workflow_dispatch:

concurrency:
  group: p1-k-stella-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Assemble + zero-cost patch + syntax check
        run: npm run check

      - name: P1 zero-cost preflight
        run: npm run preflight

      - name: Check Cloudflare token
        id: creds
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare token is configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare token is not configured; validation passed and deploy is safely skipped."
          fi

      - name: Resolve dedicated K-STELLA-P1 account
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          resp=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts?per_page=100")
          account_id=$(printf '%s' "$resp" | jq -r '[.result[]? | select(.name == "K-STELLA-P1")][0].id // empty')
          if [ -z "$account_id" ]; then
            echo "Dedicated Cloudflare account K-STELLA-P1 was not found by this token."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "Resolved dedicated K-STELLA-P1 account."

      - name: Ensure dedicated D1 exists
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d1_json=$(npx wrangler d1 list --json)
          if ! printf '%s' "$d1_json" | jq -e '.[]? | select(.name == "k-stella-shorts-factory")' >/dev/null; then
            echo "Creating dedicated D1 k-stella-shorts-factory"
            npx wrangler d1 create k-stella-shorts-factory
          else
            echo "Dedicated D1 already exists."
          fi

      - name: Ensure zero-cost KV namespace exists
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          list=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=100")
          if [ "$(printf '%s' "$list" | jq -r '.success')" != "true" ]; then
            printf '%s\n' "$list" | jq .
            exit 1
          fi
          kv_id=$(printf '%s' "$list" | jq -r '[.result[]? | select(.title == "k-stella-shorts-assets-kv")][0].id // empty')
          if [ -z "$kv_id" ]; then
            echo "Creating zero-cost Workers KV namespace k-stella-shorts-assets-kv"
            created=$(curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"title":"k-stella-shorts-assets-kv"}' \
              "$api")
            if [ "$(printf '%s' "$created" | jq -r '.success')" != "true" ]; then
              printf '%s\n' "$created" | jq .
              exit 1
            fi
            kv_id=$(printf '%s' "$created" | jq -r '.result.id // empty')
          else
            echo "Zero-cost KV namespace already exists."
          fi
          if [ -z "$kv_id" ]; then
            echo "KV namespace ID could not be resolved."
            exit 1
          fi
          echo "KV_NAMESPACE_ID=$kv_id" >> "$GITHUB_ENV"
          echo "Resolved zero-cost KV namespace."

      - name: Generate dedicated D1 + KV bindings
        if: steps.creds.outputs.ready == 'true'
        run: npm run generate:wrangler

      - name: Verify no R2 billing dependency
        if: steps.creds.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '[[kv_namespaces]]' wrangler.generated.toml
          grep -Fq 'binding = "ASSETS_BUCKET"' wrangler.generated.toml
          grep -Fq 'STORAGE_MODE = "kv-free"' wrangler.generated.toml
          if grep -Fq '[[r2_buckets]]' wrangler.generated.toml; then
            echo "R2 billing dependency found; refusing deployment."
            exit 1
          fi
          echo "Zero-cost storage config verified: Workers KV, no R2."

      - name: Wrangler dry-run
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler.generated.toml --dry-run --outdir .wrangler-dry-run

      - name: Deploy P1 Worker only
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.generated.toml 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | tail -1 || true)
          if [ -z "$URL" ]; then
            echo "Could not determine workers.dev URL from deploy output"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: End-to-end health verification
        if: steps.creds.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/verify-deploy.mjs
