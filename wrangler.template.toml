name = "k-stella-shorts-factory"
main = "src/index.js"
compatibility_date = "2026-09-11"
workers_dev = true

[vars]
IMAGE_MODEL = "@cf/black-forest-labs/flux-2-klein-4b"
TEXT_MODEL = "@cf/zai-org/glm-4.7-flash"
TTS_MODEL = "@cf/myshell-ai/melotts"
TTS_LANG = "KR"

[[d1_databases]]
binding = "DB"
database_name = "k-stella-shorts-factory"
database_id = "__D1_DATABASE_ID__"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "k-stella-shorts-assets"

[ai]
binding = "AI"
